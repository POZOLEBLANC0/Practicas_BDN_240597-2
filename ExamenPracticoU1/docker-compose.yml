version: '3.8'

services:
  # Servicio de Base de Datos PostgreSQL
  postgres_240597:
    image: postgres:15-alpine
    container_name: postgres_240597
    restart: always
    environment:
      POSTGRES_DB: db_test_7b
      POSTGRES_USER: mario.banda
      POSTGRES_PASSWORD: "Tacosdepastor"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_240597:/var/lib/postgresql/data

  # Servicio de Interfaz Web pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_240597
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "mario.banda@utxicotepec.edu.mx"
      PGADMIN_DEFAULT_PASSWORD: "509006"
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "40597:80"
    depends_on:
      - postgres_240597

volumes:
  postgres_data_240597:
    driver: local