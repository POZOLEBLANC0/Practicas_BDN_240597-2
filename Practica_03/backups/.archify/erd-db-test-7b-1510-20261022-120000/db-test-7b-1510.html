function highlightRel(r){tableEls.forEach((el,k)=>el.classList.toggle('dim',k!==r.from&&k!==r.to));edgeEls.forEach(({group,path},k)=>{group.classList.toggle('dim',k!==r.id);path.classList.toggle('active',k===r.id)});for(const c of [r.fromColumn,r.toColumn])if(c)colEls.get(c)?.classList.add('hl')}
function clearHighlight(){tableEls.forEach(el=>el.classList.remove('dim'));edgeEls.forEach(({group,path})=>{group.classList.remove('dim');path.classList.remove('active')});colEls.forEach(el=>el.classList.remove('hl'))}
function showDetails(t){const rels=DB.relationships.filter(r=>r.from===t.id||r.to===t.id);$('#drawer').innerHTML=`<div class="drawer-top"><div><div class="domain">${esc(t.domain)} · ${esc(DB.database)}</div><h2>${esc(t.label)}</h2><div class="muted">${t.count.toLocaleString('es-MX')} registros presentes en el respaldo</div></div><button class="btn" data-close>✕</button></div><h4>Índices y claves</h4>${t.indexes.map(i=>`<div class="detail"><b>${esc(i.kind)}</b> · ${esc(i.name)}<br><small>${esc(i.columns.join(', '))}</small></div>`).join('')||'<div class="detail">Sin índices adicionales.</div>'}<h4>Triggers (${t.triggers.length})</h4>${t.triggers.map(x=>`<div class="detail">${esc(x)}</div>`).join('')||'<div class="detail">No definidos para esta tabla en el dump.</div>'}<h4>Relaciones (${rels.length})</h4>${rels.map(r=>`<div class="detail"><b>${esc(r.id)}</b><br>${esc(r.from)} → ${esc(r.to)}<br><small>${esc(r.label)}</small></div>`).join('')||'<div class="detail">Sin claves foráneas.</div>'}<h4>Composición</h4><div class="detail">${t.attributes.length} columnas · PK (${esc(t.pk.join(', ')||'no declarada')})<br><small>${t.attributes.filter(a=>String(a.key||'').includes('fk')).length} columnas FK · ${t.attributes.filter(a=>String(a.key||'').includes('uk')).length} columnas únicas</small></div>`;openDrawer()}
function showRelation(r){const from=DB.tables.find(t=>t.id===r.from),to=DB.tables.find(t=>t.id===r.to);$('#drawer').innerHTML=`<div class="drawer-top"><div><div class="domain">Integridad referencial</div><h2>${esc(r.id)}</h2></div><button class="btn" data-close>✕</button></div><h4>Conexión</h4><div class="detail">${esc(r.from)} (${esc(r.fromCardinality)}) → ${esc(r.to)} (${esc(r.toCardinality)})</div><h4>Columnas implicadas</h4><div class="detail">${esc(r.label)}</div><h4>Cardinalidad</h4><div class="detail">Un registro en <b>${esc(r.to)}</b> puede relacionarse con varios registros en <b>${esc(r.from)}</b>.${r.fromOptional?' La FK permite NULL.':' La FK es obligatoria.'}</div><h4>Reglas del dump</h4><div class="detail">${esc(r.label.split(' · ').slice(-2).join(' · '))}<br><small>Si la cláusula no aparece en el DDL, se informa “NO ESPECIFICADO”.</small></div>`;openDrawer()}
function openDrawer(){$('#drawerBg').classList.add('open')}$('#drawerBg').addEventListener('click',e=>{if(e.target.id==='drawerBg'||e.target.closest('[data-close]'))$('#drawerBg').classList.remove('open')});
function applyTransform(){ $('#canvas').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;drawEdges()}function setZoom(v,cx=innerWidth/2,cy=innerHeight/2){let old=scale;scale=Math.max(.35,Math.min(1.5,v));tx=cx-(cx-tx)*scale/old;ty=cy-(cy-105-ty)*scale/old;applyTransform()}$('#plus').onclick=()=>setZoom(scale*1.15);$('#minus').onclick=()=>setZoom(scale/1.15);$('#fit').onclick=()=>{scale=.64;tx=20;ty=8;applyTransform()};$('#reset').onclick=$('#fit').onclick;
$('#viewport').addEventListener('wheel',e=>{e.preventDefault();setZoom(scale*(e.deltaY<0?1.08:.92),e.clientX,e.clientY)},{passive:false});$('#viewport').addEventListener('pointerdown',e=>{if(e.target.closest('.entity'))return;drag={x:e.clientX-tx,y:e.clientY-ty};$('#viewport').classList.add('dragging');e.currentTarget.setPointerCapture(e.pointerId)});$('#viewport').addEventListener('pointermove',e=>{if(!drag)return;tx=e.clientX-drag.x;ty=e.clientY-drag.y;$('#canvas').style.transition='none';applyTransform()});$('#viewport').addEventListener('pointerup',()=>{drag=null;$('#viewport').classList.remove('dragging');$('#canvas').style.transition='transform .32s cubic-bezier(.2,.75,.25,1)'});
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();let found=null;for(const t of DB.tables){const el=tableEls.get(t.id),match=!q||t.id.toLowerCase().includes(q)||t.attributes.some(a=>a.name.toLowerCase().includes(q));el.classList.toggle('filtered',!match);if(q&&match&&!found)found=t}if(found){const [x,y]=positions[found.id];scale=.9;tx=innerWidth/2-(x+155)*scale;ty=(innerHeight-105)/2-y*scale;applyTransform()}else if(!q)clearHighlight()});
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#drawerBg').classList.remove('open');$('#search').value='';$('#search').dispatchEvent(new Event('input'))}if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}});
render();applyTransform();
</script></body></html>
